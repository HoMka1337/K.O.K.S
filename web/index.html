<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KoKs | локальный ассистент</title>
  <style>
    :root {
      --ink: #17211b;
      --muted: #68736b;
      --paper: #f5f2e9;
      --panel: #fffdf7;
      --line: #d9ded4;
      --accent: #d85b3f;
      --accent-dark: #a93d2a;
      --user: #e6efdf;
      --assistant: #fffdf7;
      --shadow: 0 18px 50px rgba(47, 58, 42, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 10% 0%, #e6eadb 0, transparent 34%), var(--paper);
      font: 16px/1.5 Georgia, 'Times New Roman', serif;
    }
    .shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 5px; color: var(--accent-dark); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 6vw, 64px); line-height: .95; letter-spacing: 0; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 13px Arial, sans-serif; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #c3c8c0; }
    .dot.ready { background: #4e9b62; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; }
    .chat, aside { background: rgba(255, 253, 247, .84); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .chat { min-height: 660px; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; }
    .message { max-width: 82%; margin: 0 0 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user { margin-left: auto; background: var(--user); border-color: #c9d9be; }
    .message.assistant { background: var(--assistant); }
    .label { display: block; margin-bottom: 5px; color: var(--muted); font: 700 11px Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--line); background: #f8f6ee; }
    textarea { min-height: 54px; flex: 1; resize: vertical; padding: 13px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 2px; font: inherit; }
    button { border: 0; border-radius: 2px; padding: 0 20px; color: white; background: var(--accent); font: 700 14px Arial, sans-serif; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: .55; cursor: wait; }
    aside { align-self: start; padding: 18px; font-family: Arial, sans-serif; }
    aside h2 { margin: 0 0 14px; font-size: 16px; }
    aside p { color: var(--muted); font-size: 13px; }
    .actions { display: grid; gap: 8px; margin-top: 18px; }
    .actions button { min-height: 40px; color: var(--ink); background: transparent; border: 1px solid var(--line); }
    .actions button:hover { background: #edf1e8; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 18px, 680px); padding-top: 16px; }
      header { align-items: start; flex-direction: column; }
      main { grid-template-columns: 1fr; }
      .chat { min-height: calc(100vh - 190px); }
      aside { order: -1; }
      .message { max-width: 94%; }
      form { flex-direction: column; }
      form button { min-height: 44px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div><p class="eyebrow">локальный интеллект</p><h1>KoKs</h1></div>
      <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">проверяю модель...</span></div>
    </header>
    <main>
      <section class="chat" aria-label="Диалог с KoKs">
        <div id="messages"></div>
        <form id="query-form">
          <textarea id="query" placeholder="Напишите запрос..." aria-label="Запрос"></textarea>
          <button id="send" type="submit">Отправить</button>
        </form>
      </section>
      <aside>
        <h2>Сеанс</h2>
        <p>Ответы и память остаются на локальном сервере KoKs.</p>
        <div class="actions">
          <button id="refresh" type="button">Обновить память</button>
          <button id="clear" type="button">Очистить экран</button>
        </div>
        <p id="memory-count">Сообщений в памяти: ...</p>
      </aside>
    </main>
  </div>
  <script>
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#query-form');
    const query = document.querySelector('#query');
    const send = document.querySelector('#send');
    const statusDot = document.querySelector('#status-dot');
    const statusText = document.querySelector('#status-text');
    const memoryCount = document.querySelector('#memory-count');

    function addMessage(role, text) {
      const item = document.createElement('article');
      item.className = `message ${role}`;
      item.innerHTML = `<span class="label">${role === 'user' ? 'Вы' : 'KoKs'}</span>`;
      const content = document.createElement('span');
      content.textContent = text;
      item.appendChild(content);
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    async function refreshHealth() {
      try {
        const response = await fetch('/health');
        const data = await response.json();
        statusDot.classList.toggle('ready', data.status === 'ok' && data.model_loaded);
        statusText.textContent = data.model_loaded ? 'модель готова' : 'модель не загружена';
      } catch (error) {
        statusText.textContent = 'сервер недоступен';
      }
    }

    async function refreshMemory() {
      const response = await fetch('/memory');
      const data = await response.json();
      memoryCount.textContent = `Сообщений в памяти: ${data.context.length}`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = query.value.trim();
      if (!text) return;
      addMessage('user', text);
      query.value = '';
      send.disabled = true;
      try {
        const response = await fetch('/query', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({query: text, confirmed: false})
        });
        const data = await response.json();
        addMessage('assistant', data.response || data.error || 'Пустой ответ');
        await refreshMemory();
      } catch (error) {
        addMessage('assistant', `Ошибка соединения: ${error.message}`);
      } finally {
        send.disabled = false;
        query.focus();
      }
    });

    document.querySelector('#clear').addEventListener('click', () => { messages.replaceChildren(); });
    document.querySelector('#refresh').addEventListener('click', refreshMemory);
    addMessage('assistant', 'Готов. Чем займёмся?');
    refreshHealth();
    refreshMemory();
  </script>
</body>
</html>
